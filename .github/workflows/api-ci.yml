name: API CI

on:
  pull_request:
    paths:
      - "apps/sasd-detection-api/**"
      - ".github/workflows/api-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/sasd-detection-api/**"
      - ".github/workflows/api-ci.yml"

defaults:
  run:
    working-directory: app/sasd-detection-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: "pip"
          cache-dependency-path: apps/sasd-detection-api/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Lint
        run: pylint src tests

      - name: Format check
        run: black --check src tests

      - name: Test
        run: pytest -v
