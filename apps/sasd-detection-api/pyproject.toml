[project]
name = "sasd-detection-api"
version = "0.1.0"
description = "Flask API for SASD Analysis of project artefacts using NLP"
requires-python = ">=3.12"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pylint.main]
load-plugins = ["pylint_pytest"]
py-version = "3.12"

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
]

[tool.pylint.design]
max-args = 8

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
