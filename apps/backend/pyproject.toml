[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sasd-backend"
version = "0.2.0"
description = "SASD Detection Tool - Backend"
requires-python = ">=3.14"
dependencies = [
    "anthropic",
    "flask",
    "flask-cors",
    "flask-injector",
    "injector",
    "pydantic",
    "python-dotenv",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
